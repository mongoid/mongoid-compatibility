name: CI RSpec Test

on: [push, pull_request]

jobs:
  build:
    name: Ruby ${{ matrix.entry.ruby }} / Mongoid ${{ matrix.entry.mongoid }} / MongoDB ${{ matrix.entry.mongodb }}
    runs-on: ubuntu-latest
    env:
      CI: true
      COVERAGE: ${{ matrix.entry.ruby == '3.4' }}
      BUNDLE_GEMFILE: gemfiles/mongoid_${{ matrix.entry.mongoid }}.gemfile
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '2.6', mongoid: '3', mongodb: '3.6' }
          - { ruby: '2.6', mongoid: '4', mongodb: '3.6' }
          - { ruby: '2.6', mongoid: '5', mongodb: '3.6' }
          - { ruby: '2.6', mongoid: '6', mongodb: '4.0' }
          - { ruby: '2.6', mongoid: '7', mongodb: '4.2' }
          - { ruby: '2.7', mongoid: '7', mongodb: '4.4' }
          - { ruby: '3.0', mongoid: '8', mongodb: '5.0' }
          - { ruby: '3.1', mongoid: '8', mongodb: '6.0' }
          - { ruby: '3.1', mongoid: '9', mongodb: '5.0' }
          - { ruby: '3.2', mongoid: '9', mongodb: '7.0' }
          - { ruby: '3.3', mongoid: '9', mongodb: '8.0' }
          - { ruby: '3.4', mongoid: '9', mongodb: '8.0' }
          - { ruby: '4.0', mongoid: '9', mongodb: '8.0' }
    steps:
      - uses: actions/checkout@v6
      - name: Set up MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.entry.mongodb }}
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake spec
      - name: Coveralls
        if: matrix.entry.ruby == '3.4'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/.resultset.json
          format: simplecov
